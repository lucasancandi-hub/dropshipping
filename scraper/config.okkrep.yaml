# =============================================================================
# okkrep.com
#
# Paginazione, ricarico e politeness sono già impostati.
# Mancano solo i SELETTORI: si riempiono da soli con
#
#   python -m catalog_scraper.inspect --html-file catalogo.html \
#          --write-config config.okkrep.yaml
#
# dove catalogo.html è una pagina del catalogo salvata dal browser
# (Salva con nome > Pagina web, completa).
# =============================================================================

site:
  name: okkrep
  base_url: "https://okkrep.com"

  # I parametri fissi restano nell'URL; `page` lo aggiunge lo scraper a ogni giro.
  catalog_url: "https://okkrep.com/product/productList?keyword=&category="

  pagination:
    mode: query
    param: page
    start: 1
    step: 1
    max_pages: 264
    # Non serve arrivare in fondo per forza: lo scraper si ferma da solo
    # quando una pagina non porta prodotti nuovi.

# --- Griglia catalogo --------------------------------------------------------
# SOSTITUITI AUTOMATICAMENTE da --write-config: i valori qui sotto sono
# segnaposto e non funzionano.
selectors:
  product_card: "DA_RILEVARE"
  title: "DA_RILEVARE"
  url: "DA_RILEVARE"
  price: "DA_RILEVARE"
  image: "DA_RILEVARE"

# --- Scheda prodotto ---------------------------------------------------------
# Al primo giro lascia enabled: false e verifica griglia e prezzi.
# Poi salva una scheda prodotto, lanciaci inspect e compila questo blocco.
detail:
  enabled: false
  gallery: ""
  variants: ""            # es. "select[name='size'] option" o ".size-btn"
  variant_attribute: "Taglia"
  description: ""
  sku: ""
  max_products: 0         # metti 50 per una prima prova rapida

# --- Trasporto ---------------------------------------------------------------
http:
  engine: requests        # se la griglia è renderizzata in JS: selenium
  timeout: 25
  retries: 3
  respect_robots: true

  # 264 pagine a 1,5 s l'una sono ~7 minuti: un ritmo che non pesa sul server
  # del fornitore e non rischia di far bloccare il tuo IP.
  delay: 1.5

  # Solo con engine: selenium
  headless: true
  wait_selector: ""
  scroll: false

parsing:
  decimal_separator: ""   # "" = autodetect; metti "," se i prezzi sono 1.234,56
  thousands_separator: ""
  currency: "EUR"
  default_category: "Catalogo"
  sku_prefix: "OKK"

# --- Ricarico ----------------------------------------------------------------
pricing:
  markup_percent: 60      # sotto soglia
  price_tiers:
    - above: 100          # soglia inclusiva: da 100 in su
      percent: 50
  category_markup: {}     # eventuali eccezioni per categoria
  rounding: charm         # 49,00 -> 49,90
  charm_ending: 0.90
  min_price: 0
  include_cost_in_output: false
