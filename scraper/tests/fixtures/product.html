<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8"><title>Felpa Oversize Nera</title></head>
<body>
  <section class="product">
    <div class="product__media-list">
      <img src="/img/felpa-fronte.jpg" alt="fronte">
      <img data-src="/img/felpa-retro.jpg" alt="retro">
      <img srcset="/img/felpa-dettaglio-600.jpg 600w, /img/felpa-dettaglio-1400.jpg 1400w" alt="dettaglio">
    </div>

    <div class="product__info">
      <p class="product__sku">FLP-OVR-NER</p>
      <h1>Felpa Oversize Nera</h1>
      <p class="product__subtitle">Cotone pesante 400 g/m², vestibilità oversize.</p>
      <div class="product__price"><span class="money">€ 59,90</span></div>

      <select name="Taglia">
        <option value="">Seleziona una taglia</option>
        <option value="S" data-price="59,90">S</option>
        <option value="M" data-price="59,90">M</option>
        <option value="L" data-price="64,90">L</option>
        <option value="XL" disabled>XL</option>
      </select>

      <div class="product__description">
        Felpa girocollo in cotone organico, cuciture rinforzate, lavabile in lavatrice a 30°.
      </div>
    </div>
  </section>
</body>
</html>
